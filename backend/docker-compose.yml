# CADOTER — backend Laravel + PostgreSQL (aucune installation PHP en local)
# Ports hôte : 5433 (Postgres) et 8001 (API), car 5432/8000 sont pris par PEKEGNO.
services:
  postgres:
    image: pgvector/pgvector:pg16 # PostgreSQL 16 + extension pgvector (recherche de l'assistante IA)
    container_name: cadoter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cadoter
      POSTGRES_USER: cadoter
      POSTGRES_PASSWORD: cadoter_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadoter -d cadoter"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: ./docker/php
    image: cadoter-php
    container_name: cadoter-backend
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    environment:
      COMPOSER_HOME: /tmp/composer
      # Plusieurs requêtes en parallèle (l'assistante IA peut répondre en quelques secondes)
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./:/var/www
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # --no-reload : requis pour PHP_CLI_SERVER_WORKERS (redémarrer le conteneur après un changement du .env)
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  # File d'attente : indexation des cadeaux pour l'assistante IA (étiquettes + vecteurs)
  queue:
    image: cadoter-php
    container_name: cadoter-queue
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan queue:work --tries=3 --backoff=30 --sleep=3 --max-time=3600

  # Planificateur : rappels e-mail des dates importantes (tous les jours à 08:00)
  scheduler:
    image: cadoter-php
    container_name: cadoter-scheduler
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan schedule:work

volumes:
  postgres_data:
